name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits instead of cancelling one in progress.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  HUSKY: 0

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Production build with the /lectura-biblica/ base href, plus 404.html for deep links (ADR 0002).
      - run: npx nx run reader:pages

      - name: Deploy output has no docs
        run: |
          leaks=$(find dist/apps/reader/browser \( -name '*.md' -o -name docs -o -name .claude \) || true)
          if [ -n "$leaks" ]; then echo "::error::Docs in deploy output:"; echo "$leaks"; exit 1; fi

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/apps/reader/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
